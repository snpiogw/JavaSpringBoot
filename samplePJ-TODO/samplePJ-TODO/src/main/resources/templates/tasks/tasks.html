<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .empty-container { 
            text-align: center; 
            background: #fff; 
            padding: 40px 60px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .empty-text {
            font-size: 1.25rem;
            color: #6c757d;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="empty-container">
        <div class="empty-text">
            現在タスクは登録されていません。
        </div>
        
        <a th:href="@{/tasks/new}" class="btn btn-success btn-lg px-4">新規作成</a>
    </div>

</body>
</html>
