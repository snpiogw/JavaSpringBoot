<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h4 class="text-center fw-bold mb-4">ログイン</h4>
        <p th:if="${param.error}" class="alert alert-danger text-center">ログインに失敗しました。</p>
        <p th:if="${param.logout}" class="alert alert-success text-center">ログアウトしました。</p>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">ユーザ名</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">ログイン</button>
        </form>
        
        <div class="text-center mt-3">
            <a th:href="@{/register}">新規登録はこちら</a>
        </div>
    </div>
</body>
</html>
