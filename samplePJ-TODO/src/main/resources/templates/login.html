<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="center-body">
    <div class="auth-card">
        <h4 class="text-center fw-bold mb-4">ログイン</h4>

        <p th:if="${param.error}" class="alert alert-danger text-center">
            ログインに失敗しました。
        </p>

        <p th:if="${param.logout}" class="alert alert-success text-center">
            ログアウトしました。
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-3">
                <label for="username" class="form-label">ユーザー名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="ユーザー名" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="パスワード" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">ログイン</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/register}">新規登録はこちら</a>
        </div>
    </div>
</body>
</html>
