<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container main-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold text-center flex-grow-1">タスク一覧</h1>
			<form th:action="@{/logout}" method="post" class="d-inline">
			    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			    <button type="submit" class="btn btn-outline-danger">ログアウト</button>
			</form>
		        </div>

        <div th:if="${not #lists.isEmpty(tasks)}">
            <div class="table-responsive">
                <table class="table table-striped table-bordered table-hover align-middle">
                    <thead class="text-center">
                        <tr>
                            <th>ID</th>
                            <th>タイトル</th>
                            <th>内容</th>
                            <th>登録者</th>
                            <th>開始日</th>
                            <th>終了日</th>
                            <th>作成日時</th>
                            <th>更新日時</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task : ${tasks}" class="text-center">
                            <td th:text="${task.id}"></td>
                            <td class="text-start" th:text="${task.title}"></td>
							<td class="text-start text-truncate task-content-cell" th:text="${task.content}"></td>
                            <td th:text="${task.registrantName}"></td>
							<td th:text="${task.startDate != null ? #temporals.format(task.startDate, 'yyyy-MM-dd') : ''}"></td>
							<td th:text="${task.endDate != null ? #temporals.format(task.endDate, 'yyyy-MM-dd') : ''}"></td>
							<td th:text="${task.createdAt != null ? #temporals.format(task.createdAt, 'yyyy-MM-dd HH:mm:ss') : ''}"></td>
							<td th:text="${task.updatedAt != null ? #temporals.format(task.updatedAt, 'yyyy-MM-dd HH:mm:ss') : ''}"></td>
							
                            <td>
                                <div class="d-flex gap-1 justify-content-center">
                                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-primary btn-sm">編集</a>
                                    <form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post" onsubmit="return confirm('本当に削除しますか？');">
                                        <button type="submit" class="btn btn-danger btn-sm">削除</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

			<div class="row mt-4 align-items-center">
			    <div class="col"></div>

			    <!-- 2ページ以上ある場合だけページングを表示 -->
			    <div class="col-auto" th:if="${totalPages > 1}">
			        <nav>
			            <ul class="pagination pagination-sm m-0">

			                <!-- 前へ -->
			                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
			                    <a class="page-link"
			                       th:href="@{/tasks(page=${currentPage - 1})}">
			                        « 前
			                    </a>
			                </li>

			                <!-- ページ番号 -->
			                <li class="page-item"
			                    th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
			                    th:classappend="${pageNum == currentPage} ? 'active'">
			                    <a class="page-link"
			                       th:href="@{/tasks(page=${pageNum})}"
			                       th:text="${pageNum}">
			                        1
			                    </a>
			                </li>

			                <!-- 次へ -->
			                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
			                    <a class="page-link"
			                       th:href="@{/tasks(page=${currentPage + 1})}">
			                        次 »
			                    </a>
			                </li>

			            </ul>
			        </nav>
			    </div>

			    <div class="col text-end">
			        <a th:href="@{/tasks/new}" class="btn btn-success">新規作成</a>
			    </div>
			</div>     

        <div th:if="${#lists.isEmpty(tasks)}" class="empty-wrapper">
            <div class="empty-container">
                <div class="empty-text">
                    現在タスクは登録されていません。「新規登録」から追加してください。
                </div>
                <a th:href="@{/tasks/new}" class="btn btn-success btn-lg px-4">新規作成</a>
            </div>
        </div>

    </div>
</body>
</html>
