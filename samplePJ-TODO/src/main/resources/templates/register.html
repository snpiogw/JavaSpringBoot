<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザ登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .register-card { width: 100%; max-width: 400px; padding: 30px; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="register-card">
        <h4 class="text-center fw-bold mb-4">ユーザ登録</h4>
		<p th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
		</p>
        <form th:action="@{/register}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			
            <div class="mb-3">
                <label for="username" class="form-label">ユーザ名 (半角英字)</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">パスワード (半角英数字)</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">登録</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/login}">ログインはこちら</a>
        </div>
    </div>
</body>
</html>
