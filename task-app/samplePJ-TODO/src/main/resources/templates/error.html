<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>入力エラー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .error-card { text-align: center; padding: 40px; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="error-card">
		<h3 class="text-danger mb-4">
		エラーが発生しました
		</h3>

		<p th:text="${message}">
		エラーメッセージ
		</p>
        <a href="javascript:history.back()" class="btn btn-secondary mt-3">戻る</a>
    </div>
</body>
</html>
